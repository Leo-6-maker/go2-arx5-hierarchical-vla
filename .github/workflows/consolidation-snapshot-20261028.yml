name: consolidation-snapshot-20261028

on:
  push:
    branches: [maintenance/main-consolidation-20261028]
    paths: [.github/workflows/consolidation-snapshot-20261028.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: false
      - name: Capture repository history only; no scientific imports or execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation"
          git fetch --no-tags origin 'refs/heads/*:refs/remotes/origin/*'
          git bundle create "$RUNNER_TEMP/consolidation/repository.bundle" --all
          git bundle verify "$RUNNER_TEMP/consolidation/repository.bundle"
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin refs/tags > "$RUNNER_TEMP/consolidation/refs.txt"
          sha256sum "$RUNNER_TEMP/consolidation/repository.bundle" > "$RUNNER_TEMP/consolidation/SHA256SUMS"
          cat "$RUNNER_TEMP/consolidation/refs.txt"
          cat "$RUNNER_TEMP/consolidation/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: repository-consolidation-snapshot
          path: ${{ runner.temp }}/consolidation/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
